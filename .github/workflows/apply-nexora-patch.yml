name: Apply Nexora replacement patch

on:
  push:
    branches:
      - replace-with-new-nexora-cms
    paths:
      - .upload/nexora_text_patch.tar.gz

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: replace-with-new-nexora-cms
          fetch-depth: 0

      - name: Apply prepared website patch
        run: |
          tar -xzf .upload/nexora_text_patch.tar.gz
          rm -rf .upload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply Nexora website and CMS replacement"
          git push origin HEAD:replace-with-new-nexora-cms
